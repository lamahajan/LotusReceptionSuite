<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon-192.png"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#b5883e"/>
<title>Parent Desk - DigiFee Mitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeae2;--panel:#fff;--ink:#1b2a2f;--mute:#6b7c85;--line:#e3e8ea;--brand:#0b5d4f;--in:#fff;--hl:#d9f2e6}
@media(prefers-color-scheme:dark){:root{--bg:#0e1517;--panel:#162024;--ink:#e6edf0;--mute:#8aa0a9;--line:#24343a;--brand:#27a58a;--in:#1f2e34;--hl:#1c3a33}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#075E54,#128C7E);color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2);position:relative;z-index:3}
header h1{font:800 18px Outfit,sans-serif;letter-spacing:.2px;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0}
header button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:6px 12px;font:600 13px Outfit,sans-serif;cursor:pointer;backdrop-filter:blur(4px)}
header button:hover{background:rgba(255,255,255,.26)}
header button:focus-visible,input:focus-visible,.chat:focus-visible{outline:2px solid #fff;outline-offset:2px}
#status{font-size:12px;opacity:.85}
main{flex:1;display:flex;min-height:0}
#list{width:340px;max-width:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.sbar{height:60px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:2;box-shadow:0 2px 10px rgba(15,23,42,.05)}
#q{flex:1;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
#chats{flex:1;overflow:auto}
#chats{padding:6px 10px 10px;background:#f1f5f9}
@media(prefers-color-scheme:dark){#chats{background:#0e1517}}
.chat{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);color:inherit;font:inherit;border:1.5px solid transparent;border-radius:14px;padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.chat:hover{border-color:var(--line)}.chat.on{border-color:#25D366;background:var(--hl)}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:800 14px Outfit,sans-serif;flex-shrink:0}
.cb{flex:1;min-width:0}
.nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:5px;align-items:center;margin-top:3px;flex-wrap:wrap;font:10px Outfit,sans-serif;color:#94a3b8}
.chip{background:#f1f5f9;color:#475569;padding:1px 8px;border-radius:20px;font-weight:600;font-size:10px}
@media(prefers-color-scheme:dark){.chip{background:#24343a;color:#c5d3d8}}
.side{text-align:right;flex-shrink:0;font:11px Outfit,sans-serif;color:var(--mute)}
.pv{margin-top:4px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{display:flex;gap:6px;flex-wrap:wrap}
.dot{display:inline-block;min-width:8px;height:8px;border-radius:4px;background:#25D366;margin-right:6px}
#thread{flex:1;display:flex;flex-direction:column;min-width:0}
#tt{display:flex;align-items:center;gap:10px;padding:0 16px;height:60px;flex-shrink:0;box-sizing:border-box;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(15,23,42,.05);cursor:pointer;position:relative;z-index:2;transition:background .15s}
#tt:hover{background:rgba(37,211,102,.07)}
#tt:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
#tt .av{width:34px;height:34px;border-radius:10px;font-size:12px}
.hb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden}
.tc{display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
.sp{display:inline-flex;align-items:center;gap:7px;padding:4px 5px 4px 12px;border-radius:20px;font:700 12.5px Outfit,sans-serif;white-space:nowrap}
.sp em{font-style:normal;background:rgba(255,255,255,.7);padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;margin-right:0}
.sp:not(:has(em)){padding-right:12px}
.tn{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp{font:12px Outfit,sans-serif;color:var(--mute);white-space:nowrap}
.inf{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);color:var(--mute);display:flex;align-items:center;justify-content:center;font:italic 700 12px Georgia,serif;flex-shrink:0}
#tt:hover .inf{border-color:var(--brand);color:var(--brand)}
#info{position:fixed;inset:0;background:rgba(10,20,25,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#info.open{display:flex}
.ic{background:var(--panel);width:420px;max-width:100%;max-height:92vh;overflow:auto;border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.97);opacity:0}}
@media(prefers-reduced-motion:reduce){.ic{animation:none}}
.ih{display:flex;align-items:center;gap:14px;padding:20px 20px 18px;background:linear-gradient(135deg,#075E54,#128C7E);color:#fff;position:relative}
.ih .av{width:52px;height:52px;border-radius:16px;font-size:18px}
.ih h3{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
.ih p{margin:2px 0 0;font-size:13px;opacity:.85}
.ix{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.ix:hover{background:rgba(255,255,255,.3)}
.ib{padding:16px 20px 20px}
.ib h4{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--mute)}
.st{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.st .av{width:38px;height:38px;border-radius:12px;font-size:13px}
.st div.x{flex:1;min-width:0}
.st b{display:block;font-size:14px}
.st span{font:12px Outfit,sans-serif;color:var(--mute)}
.cp{border:1px solid var(--line);background:none;color:var(--mute);border-radius:8px;padding:4px 9px;font:600 11.5px Outfit,sans-serif;cursor:pointer}
.cp:hover{color:var(--brand);border-color:var(--brand)}
.ac{display:flex;gap:8px;margin:14px 0 4px}
.ac a{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:12px;font-weight:700;font-size:13.5px;border:1.5px solid var(--brand);color:var(--brand)}
.ac a.p{background:var(--brand);color:#fff}
.ft{margin-top:12px;font-size:12px;color:var(--mute)}
#msgs{flex:1;overflow:auto;padding:10px 16px 18px;display:flex;flex-direction:column;gap:8px;background-color:var(--bg);background-image:radial-gradient(rgba(7,94,84,.07) 1px,transparent 1px),linear-gradient(180deg,rgba(255,255,255,.35),transparent 160px);background-size:20px 20px,100% 100%}
.m{max-width:min(560px,82%);background:var(--in);padding:10px 14px 7px;border-radius:5px 18px 18px 18px;border:1px solid rgba(7,94,84,.08);box-shadow:0 1px 2px rgba(15,23,42,.06),0 6px 18px rgba(15,23,42,.06);overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5;font-size:14.5px}
.m.g{margin-top:-4px;border-top-left-radius:18px}
.m .t{float:right;margin:8px 0 0 16px;font:500 10.5px Outfit,sans-serif;color:var(--mute);white-space:nowrap;letter-spacing:.2px}
.m::after{content:"";display:block;clear:both}
.m .im{display:block;margin:-4px -8px 8px;border-radius:13px;overflow:hidden;background:rgba(0,0,0,.05);border:1px solid rgba(15,23,42,.06)}
.m .im img{display:block;max-width:100%;max-height:340px;margin:0 auto;cursor:zoom-in}
.m video{max-width:100%;max-height:340px;border-radius:10px;display:block;margin-bottom:4px}
.m audio{max-width:100%;display:block;margin-bottom:4px}
.m a{color:var(--brand)}
.doc{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:-2px -6px 8px;border-radius:12px;background:rgba(7,94,84,.07);border:1px solid rgba(7,94,84,.1);text-decoration:none;color:inherit!important;font-weight:600;font-size:13.5px}
.doc b{font-size:22px}
.day{align-self:center;position:sticky;top:6px;z-index:1;font:600 11.5px Outfit,sans-serif;letter-spacing:.3px;color:var(--mute);background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(6px);padding:4px 14px;border-radius:20px;margin:6px 0 2px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(15,23,42,.08)}
.sk{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:6px}
.sk i,.sk b{display:block;border-radius:8px;background:linear-gradient(90deg,var(--line) 25%,rgba(255,255,255,.55) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
.sk i{width:40px;height:40px;border-radius:12px;flex-shrink:0}
.sk div{flex:1;display:grid;gap:7px}.sk b{height:10px}.sk b:first-child{width:55%;height:12px}.sk b:last-child{width:80%}
@keyframes sh{to{background-position:-200% 0}}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:#128C7E;animation:rot .8s linear infinite;margin:0 auto 12px}
@keyframes rot{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sk i,.sk b,.spin{animation:none}}
.err{background:var(--panel);border-radius:14px;padding:16px;text-align:center;color:var(--mute);font-size:13px}
.err button{margin-top:10px;background:linear-gradient(135deg,#075E54,#128C7E);color:#fff;border:0;border-radius:10px;padding:7px 16px;font:600 13px Outfit,sans-serif;cursor:pointer}
.empty{margin:auto;color:var(--mute);text-align:center;padding:20px}
#more{align-self:center}
#more,#cfg button{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
#cfg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
#cfg.open{display:flex}
#cfg form{background:var(--panel);border-radius:14px;padding:20px;width:420px;max-width:100%;display:grid;gap:10px}
#cfg label{font-size:13px;color:var(--mute);display:grid;gap:4px}
#cfg input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#back{display:none}
@media(max-width:720px){
 #list{width:100%}#thread{display:none}
 body.open #list{display:none}body.open #thread{display:flex}body.open #back{display:inline-block}
}
</style>
</head>
<body>
<header>
  <button id="back" type="button">‹ Back</button>
  <h1 id="app-name"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff" aria-hidden="true" style="display:block;flex-shrink:0"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg><span>Parent Desk - DigiFee Mitra</span></h1>
  <span id="status"></span>
  <button id="set" type="button">Settings</button>
</header>
<main>
  <section id="list">
    <div class="sbar"><input id="q" type="search" placeholder="Search name, number or message" aria-label="Search"></div>
    <div id="chats"></div>
  </section>
  <section id="thread">
    <div id="tt" role="button" tabindex="0" aria-label="Chat details">Select a chat</div>
    <div id="msgs"><div class="empty">Select a chat from the list.</div></div>
  </section>
</main>
<div id="info" aria-modal="true" role="dialog"></div>
<div id="cfg"><form id="f">
  <b>Connect to your worker</b>
  <label>Worker URL<input id="u" placeholder="https://wa-inbox.yourname.workers.dev" required></label>
  <label>View token<input id="t" type="password" required></label>
  <button>Save and load</button>
</form></div>

<script>
const $=id=>document.getElementById(id);
const APP_NAME='Parent Desk - DigiFee Mitra'; // change the app name here and in <title>/<h1>
const DEFAULTS={url:'https://whatsapp.due-4a8.workers.dev',tok:''}; // optional: pre-fill (keep the file private if you add the token)
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
{const h=new URLSearchParams(location.hash.slice(1));if(h.get('url')||h.get('k')){if(h.get('url'))ls.set('waUrl',h.get('url'));if(h.get('k'))ls.set('waTok',h.get('k'));history.replaceState(null,'',location.pathname+location.search)}}
const S={loaded:false,err:'',con:{},url:ls.get('waUrl')||DEFAULTS.url,tok:ls.get('waTok')||DEFAULTS.tok,map:new Map(),cur:null,older:null,seen:{},unread:0};
const fmtT=ts=>new Date(ts*1000).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'});
const fmtD=ts=>new Date(ts*1000).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Kolkata'});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

async function api(path){
  const r=await fetch(S.url.replace(/\/$/,'')+path,{headers:{Authorization:'Bearer '+S.tok}});
  if(!r.ok)throw new Error(r.status==401?'Wrong token':'Error '+r.status);
  return r.json();
}
async function load(first){
  if(!S.url||!S.tok)return $('cfg').classList.add('open');
  if(first){S.loaded=false;S.err='';$('status').textContent='Loading…';render()}
  try{
    const d=await api('/messages');
    const before=S.map.size;
    d.messages.forEach(m=>S.map.set(m.id,m));Object.assign(S.con,d.contacts||{});
    if(first)S.older=d.cursor;
    if(!first&&S.map.size>before&&document.hidden){S.unread+=S.map.size-before;document.title=`(${S.unread}) ${APP_NAME}`}
    $('status').textContent='Updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    S.loaded=true;S.err='';render();
  }catch(e){$('status').textContent=e.message;if(!S.loaded){S.loaded=true;S.err=e.message;render()}}
}
async function older(){
  if(!S.older)return;
  const d=await api('/messages?cursor='+encodeURIComponent(S.older));
  d.messages.forEach(m=>S.map.set(m.id,m));Object.assign(S.con,d.contacts||{});S.older=d.cursor;render();
}
function chats(){
  const g={};
  [...S.map.values()].forEach(m=>{(g[m.from]=g[m.from]||{from:m.from,name:'',msgs:[]}).msgs.push(m);if(m.name)g[m.from].name=m.name});
  Object.values(g).forEach(c=>{c.msgs.sort((a,b)=>a.ts-b.ts);c.stu=S.con[c.from]||[]});
  return Object.values(g).sort((a,b)=>b.msgs.at(-1).ts-a.msgs.at(-1).ts);
}
const preview=m=>m.body||({image:'📷 Photo',video:'🎥 Video',audio:'🎤 Audio',document:'📄 '+(m.file||'Document'),sticker:'Sticker',location:'📍 Location'}[m.type]||m.type);
const PAL=[['#6366f1','#ede9fe'],['#0891b2','#cffafe'],['#059669','#d1fae5'],['#d97706','#fef3c7'],['#dc2626','#fee2e2'],['#7c3aed','#f3e8ff'],['#0284c7','#e0f2fe'],['#be185d','#fce7f3']];
const mob10=n=>String(n).replace(/\D/g,'').slice(-10);
const title=c=>c.stu.length?c.stu.map(s=>s.name).join(' & '):(c.name||'+'+c.from);
const palOf=t=>PAL[(t||'?').charCodeAt(0)%PAL.length];
const initials=t=>t.replace(/[^\p{L}\p{N} ]/gu,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'#';
function avatar(t){const pc=palOf(t),a=el('div','av',initials(t));a.style.background=pc[1];a.style.color=pc[0];return a}
function sideMsg(){
  const m=$('msgs');if(S.cur)return;
  const d=el('div','empty');
  if(!S.loaded){d.append(el('div','spin'),document.createTextNode('Loading chats…'))}
  else d.textContent=S.err&&!S.map.size?'Could not load chats.':'Select a chat from the list.';
  m.replaceChildren(d);
}
function render(){
  const q=$('q').value.toLowerCase(),box=$('chats');box.replaceChildren();
  if(!S.loaded){for(let i=0;i<5;i++){const k=el('div','sk');k.append(el('i'),Object.assign(el('div'),{}));k.lastChild.append(el('b'),el('b'),el('b'));box.append(k)}sideMsg();return}
  if(S.err&&!S.map.size){const e=el('div','err',"Couldn't load chats: "+S.err);const b=el('button','','Retry');b.onclick=()=>load(true);e.append(document.createElement('br'),b);box.append(e);sideMsg();return}
  const all=chats().filter(c=>!q||(c.name+c.from+c.stu.map(s=>s.name+s.adm+s.cls).join(' ')).toLowerCase().includes(q)||c.msgs.some(m=>(m.body||'').toLowerCase().includes(q)));
  if(!all.length)box.append(el('div','empty',S.map.size?'No match.':'No messages yet.'));
  all.forEach(c=>{
    const last=c.msgs.at(-1),b=el('button','chat'+(S.cur===c.from?' on':''));
    const t=title(c);
    const cb=el('div','cb'),nm=el('div','nm',t);
    const meta=el('div','meta');
    if(c.stu.length)c.stu.forEach(s=>meta.append(el('span','chip',(s.adm?'#'+s.adm:'')+(s.adm&&s.cls?' · ':'')+(s.cls||''))));
    else if(c.name)meta.append(el('span','chip',c.name));
    meta.append(el('span','',mob10(c.from)));
    cb.append(nm,meta,el('div','pv',preview(last)));
    const side=el('div','side');
    if((S.seen[c.from]||0)<last.ts)side.append(el('i','dot'));
    side.append(document.createTextNode(fmtT(last.ts)));
    b.append(avatar(c.stu[0]?c.stu[0].name:t),cb,side);
    b.onclick=()=>{S.cur=c.from;document.body.classList.add('open');render()};
    box.append(b);
  });
  sideMsg();thread();
}
function thread(){
  const c=chats().find(x=>x.from===S.cur);if(!c)return;
  S.seen[c.from]=c.msgs.at(-1).ts;
  const hb=el('div','hb');
  if(c.stu.length){const tc=el('div','tc');
    c.stu.forEach(s=>{const pc=palOf(s.name),sp=el('span','sp');sp.style.background=pc[1];sp.style.color=pc[0];sp.append(el('b','',s.name));if(s.cls)sp.append(el('em','',s.cls));tc.append(sp)});
    hb.append(tc)}
  else hb.append(el('b','tn',title(c)),el('span','tp',fmtPh(c.from)));
  $('tt').replaceChildren(hb,el('span','inf','i'));
  const box=$('msgs'),prev=box.scrollTop,stick=box.scrollHeight-box.scrollTop-box.clientHeight<80||!box.children.length;
  box.replaceChildren();
  if(S.older){const mb=el('button','','Load older messages');mb.id='more';mb.onclick=older;box.append(mb)}
  let day='',pt=0;
  c.msgs.forEach(m=>{
    const nd=fmtD(m.ts)!==day;
    if(nd){day=fmtD(m.ts);box.append(el('div','day',day))}
    const d=el('div','m'+(!nd&&m.ts-pt<120?' g':''));pt=m.ts;
    if(m.media){
      const src=`${S.url.replace(/\/$/,'')}/media/${m.media}?k=${encodeURIComponent(S.tok)}`;
      if(m.type==='image'||m.type==='sticker'){const w=el('a','im'),i=el('img');i.src=src;i.loading='lazy';i.alt='';w.href=src;w.target='_blank';w.rel='noopener';w.append(i);d.append(w)}
      else if(m.type==='video'){const v=el('video');v.src=src;v.controls=true;d.append(v)}
      else if(m.type==='audio'){const a=el('audio');a.src=src;a.controls=true;d.append(a)}
      else{const a=el('a','doc');a.href=src;a.target='_blank';a.rel='noopener';a.append(el('b','','📄'),document.createTextNode(m.file||'Open document'));d.append(a)}
    }
    if(m.geo){const a=el('a','doc');a.href='https://maps.google.com/?q='+m.geo;a.target='_blank';a.rel='noopener';a.append(el('b','','📍'),document.createTextNode('Open in Maps'));d.append(a)}
    if(m.body)d.append(document.createTextNode(m.body));
    d.append(el('span','t',fmtT(m.ts)));box.append(d);
  });
  if(!stick)box.scrollTop=prev;
  if(stick)box.scrollTop=box.scrollHeight;
}

const fmtPh=n=>/^91\d{10}$/.test(n)?`+91 ${n.slice(2,7)} ${n.slice(7)}`:'+'+n;
function openInfo(){
  const c=chats().find(x=>x.from===S.cur);if(!c)return;
  const box=$('info'),card=el('div','ic'),h=el('div','ih');
  const hb=el('div');hb.append(el('h3','',fmtPh(c.from)),el('p','',c.name?'WhatsApp name: '+c.name:'WhatsApp contact'));
  const x=el('button','ix','×');x.type='button';x.setAttribute('aria-label','Close');x.onclick=closeInfo;
  h.append(avatar(c.stu[0]?c.stu[0].name:title(c)),hb,x);
  const b=el('div','ib');
  if(c.stu.length){
    b.append(el('h4','',c.stu.length>1?'Students ('+c.stu.length+')':'Student'));
    c.stu.forEach(s=>{const r=el('div','st'),m=el('div','x');
      m.append(el('b','',s.name),el('span','',[s.cls&&'Class '+s.cls,s.adm&&'Admission no. '+s.adm].filter(Boolean).join(' · ')));
      r.append(avatar(s.name),m);
      if(s.adm){const cp=el('button','cp','Copy');cp.type='button';cp.title='Copy admission number';
        cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(s.adm);cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1200)};r.append(cp)}
      b.append(r)});
  }else b.append(el('p','ft','This number is not in the Due List.'));
  const ac=el('div','ac'),call=el('a','','Call'),wa=el('a','p','Open in WhatsApp');
  call.href='tel:+'+c.from;wa.href='https://wa.me/'+c.from;wa.target='_blank';wa.rel='noopener';ac.append(call,wa);b.append(ac);
  b.append(el('div','ft',c.msgs.length+' message'+(c.msgs.length>1?'s':'')+' loaded · last on '+fmtD(c.msgs.at(-1).ts)+', '+fmtT(c.msgs.at(-1).ts)));
  card.append(h,b);box.replaceChildren(card);box.classList.add('open');
}
function closeInfo(){$('info').classList.remove('open')}
$('tt').onclick=openInfo;
$('tt').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInfo()}};
$('info').onclick=e=>{if(e.target.id==='info')closeInfo()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeInfo()});
$('q').oninput=render;
$('back').onclick=()=>{S.cur=null;document.body.classList.remove('open');$('tt').textContent='Select a chat';closeInfo();render()};
$('set').onclick=()=>{$('u').value=S.url;$('t').value=S.tok;$('cfg').classList.add('open')};
$('f').onsubmit=e=>{e.preventDefault();S.url=$('u').value.trim();S.tok=$('t').value;ls.set('waUrl',S.url);ls.set('waTok',S.tok);S.map.clear();$('cfg').classList.remove('open');load(true)};
document.onvisibilitychange=()=>{if(!document.hidden){S.unread=0;document.title=APP_NAME}};
load(true);setInterval(()=>{if(!document.hidden)load(false)},10000);
</script>
