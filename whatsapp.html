<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeae2;--panel:#fff;--ink:#1b2a2f;--mute:#6b7c85;--line:#e3e8ea;--brand:#0b5d4f;--in:#fff;--hl:#d9f2e6}
@media(prefers-color-scheme:dark){:root{--bg:#0e1517;--panel:#162024;--ink:#e6edf0;--mute:#8aa0a9;--line:#24343a;--brand:#27a58a;--in:#1f2e34;--hl:#1c3a33}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--brand);color:#fff}
header h1{font-size:17px;margin:0;flex:1;font-weight:600}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
header button:focus-visible,input:focus-visible,.chat:focus-visible{outline:2px solid #fff;outline-offset:2px}
#status{font-size:12px;opacity:.85}
main{flex:1;display:flex;min-height:0}
#list{width:340px;max-width:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
#q{margin:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
#chats{flex:1;overflow:auto}
#chats{padding:6px 10px 10px;background:#f1f5f9}
@media(prefers-color-scheme:dark){#chats{background:#0e1517}}
.chat{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);color:inherit;font:inherit;border:1.5px solid transparent;border-radius:14px;padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.chat:hover{border-color:var(--line)}.chat.on{border-color:#25D366;background:var(--hl)}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:800 14px Outfit,sans-serif;flex-shrink:0}
.cb{flex:1;min-width:0}
.nm{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:5px;align-items:center;margin-top:3px;flex-wrap:wrap;font:10px Outfit,sans-serif;color:#94a3b8}
.chip{background:#f1f5f9;color:#475569;padding:1px 8px;border-radius:20px;font-weight:600;font-size:10px}
@media(prefers-color-scheme:dark){.chip{background:#24343a;color:#c5d3d8}}
.side{text-align:right;flex-shrink:0;font:11px Outfit,sans-serif;color:var(--mute)}
.pv{margin-top:4px;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.dot{display:inline-block;min-width:8px;height:8px;border-radius:4px;background:var(--brand);margin-right:6px}
#thread{flex:1;display:flex;flex-direction:column;min-width:0}
#tt{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-weight:600}
#tt small{display:block;font-weight:400;color:var(--mute)}
#msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(520px,85%);background:var(--in);padding:7px 11px;border-radius:10px;border-top-left-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.12);word-wrap:break-word;white-space:pre-wrap}
.m time{display:block;text-align:right;font-size:11px;color:var(--mute);margin-top:2px}
.m img,.m video{max-width:100%;border-radius:6px;display:block;margin-bottom:4px}
.m a{color:var(--brand)}
.day{align-self:center;font-size:12px;color:var(--mute);background:var(--panel);padding:2px 10px;border-radius:8px;margin:6px 0}
.empty{margin:auto;color:var(--mute);text-align:center;padding:20px}
#more{align-self:center}
#more,#cfg button{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
#cfg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
#cfg.open{display:flex}
#cfg form{background:var(--panel);border-radius:14px;padding:20px;width:420px;max-width:100%;display:grid;gap:10px}
#cfg label{font-size:13px;color:var(--mute);display:grid;gap:4px}
#cfg input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#back{display:none}
@media(max-width:720px){
 #list{width:100%}#thread{display:none}
 body.open #list{display:none}body.open #thread{display:flex}body.open #back{display:inline-block}
}
</style>
</head>
<body>
<header>
  <button id="back" type="button">‹ Back</button>
  <h1>WhatsApp Inbox</h1>
  <span id="status"></span>
  <button id="set" type="button">Settings</button>
</header>
<main>
  <section id="list">
    <input id="q" type="search" placeholder="Search name, number or message" aria-label="Search">
    <div id="chats"></div>
  </section>
  <section id="thread">
    <div id="tt">Select a chat</div>
    <div id="msgs"><div class="empty">Select a chat from the list.</div></div>
  </section>
</main>
<div id="cfg"><form id="f">
  <b>Connect to your worker</b>
  <label>Worker URL<input id="u" placeholder="https://wa-inbox.yourname.workers.dev" required></label>
  <label>View token<input id="t" type="password" required></label>
  <button>Save and load</button>
</form></div>

<script>
const $=id=>document.getElementById(id);
const S={con:{},url:localStorage.waUrl||'',tok:localStorage.waTok||'',map:new Map(),cur:null,older:null,seen:{},unread:0};
const fmtT=ts=>new Date(ts*1000).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'});
const fmtD=ts=>new Date(ts*1000).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Kolkata'});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

async function api(path){
  const r=await fetch(S.url.replace(/\/$/,'')+path,{headers:{Authorization:'Bearer '+S.tok}});
  if(!r.ok)throw new Error(r.status==401?'Wrong token':'Error '+r.status);
  return r.json();
}
async function load(first){
  if(!S.url||!S.tok)return $('cfg').classList.add('open');
  try{
    const d=await api('/messages');
    const before=S.map.size;
    d.messages.forEach(m=>S.map.set(m.id,m));Object.assign(S.con,d.contacts||{});
    if(first)S.older=d.cursor;
    if(!first&&S.map.size>before&&document.hidden){S.unread+=S.map.size-before;document.title=`(${S.unread}) WhatsApp Inbox`}
    $('status').textContent='Updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(e){$('status').textContent=e.message}
}
async function older(){
  if(!S.older)return;
  const d=await api('/messages?cursor='+encodeURIComponent(S.older));
  d.messages.forEach(m=>S.map.set(m.id,m));Object.assign(S.con,d.contacts||{});S.older=d.cursor;render();
}
function chats(){
  const g={};
  [...S.map.values()].forEach(m=>{(g[m.from]=g[m.from]||{from:m.from,name:'',msgs:[]}).msgs.push(m);if(m.name)g[m.from].name=m.name});
  Object.values(g).forEach(c=>{c.msgs.sort((a,b)=>a.ts-b.ts);c.stu=S.con[c.from]||[]});
  return Object.values(g).sort((a,b)=>b.msgs.at(-1).ts-a.msgs.at(-1).ts);
}
const preview=m=>m.body||({image:'📷 Photo',video:'🎥 Video',audio:'🎤 Audio',document:'📄 '+(m.file||'Document'),sticker:'Sticker',location:'📍 Location'}[m.type]||m.type);
const PAL=[['#6366f1','#ede9fe'],['#0891b2','#cffafe'],['#059669','#d1fae5'],['#d97706','#fef3c7'],['#dc2626','#fee2e2'],['#7c3aed','#f3e8ff'],['#0284c7','#e0f2fe'],['#be185d','#fce7f3']];
const mob10=n=>String(n).replace(/\D/g,'').slice(-10);
const title=c=>c.stu.length?c.stu[0].name:(c.name||'+'+c.from);
function render(){
  const q=$('q').value.toLowerCase(),box=$('chats');box.replaceChildren();
  const all=chats().filter(c=>!q||(c.name+c.from+c.stu.map(s=>s.name+s.adm+s.cls).join(' ')).toLowerCase().includes(q)||c.msgs.some(m=>(m.body||'').toLowerCase().includes(q)));
  if(!all.length)box.append(el('div','empty',S.map.size?'No match.':'No messages yet.'));
  all.forEach(c=>{
    const last=c.msgs.at(-1),b=el('button','chat'+(S.cur===c.from?' on':''));
    const t=title(c),pc=PAL[t.charCodeAt(0)%PAL.length];
    const ini=t.replace(/[^\p{L}\p{N} ]/gu,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'#';
    const av=el('div','av',ini);av.style.background=pc[1];av.style.color=pc[0];
    const cb=el('div','cb'),nm=el('div','nm',t);
    if(c.stu.length>1)nm.append(el('span','chip','+'+(c.stu.length-1)));
    const meta=el('div','meta');
    if(c.stu[0]){if(c.stu[0].adm)meta.append(el('span','','#'+c.stu[0].adm));if(c.stu[0].cls)meta.append(el('span','chip',c.stu[0].cls))}
    else if(c.name)meta.append(el('span','chip',c.name));
    meta.append(el('span','',mob10(c.from)));
    cb.append(nm,meta,el('div','pv',preview(last)));
    const side=el('div','side');
    if((S.seen[c.from]||0)<last.ts)side.append(el('i','dot'));
    side.append(document.createTextNode(fmtT(last.ts)));
    b.append(av,cb,side);
    b.onclick=()=>{S.cur=c.from;document.body.classList.add('open');render()};
    box.append(b);
  });
  thread();
}
function thread(){
  const c=chats().find(x=>x.from===S.cur);if(!c)return;
  S.seen[c.from]=c.msgs.at(-1).ts;
  const hd=el('small','','+'+c.from+(c.stu.length&&c.name?' · WhatsApp: '+c.name:''));
  const tc=el('div','tc');c.stu.forEach(s=>tc.append(el('span','chip',s.name+(s.adm?' #'+s.adm:'')+(s.cls?' · '+s.cls:''))));
  $('tt').replaceChildren(document.createTextNode(title(c)),hd,tc);
  const box=$('msgs'),stick=box.scrollHeight-box.scrollTop-box.clientHeight<80||!box.children.length;
  box.replaceChildren();
  if(S.older){const mb=el('button','','Load older messages');mb.id='more';mb.onclick=older;box.append(mb)}
  let day='';
  c.msgs.forEach(m=>{
    if(fmtD(m.ts)!==day){day=fmtD(m.ts);box.append(el('div','day',day))}
    const d=el('div','m');
    if(m.media){
      const src=`${S.url.replace(/\/$/,'')}/media/${m.media}?k=${encodeURIComponent(S.tok)}`;
      if(m.type==='image'||m.type==='sticker'){const i=el('img');i.src=src;i.loading='lazy';i.alt='';d.append(i)}
      else if(m.type==='video'){const v=el('video');v.src=src;v.controls=true;d.append(v)}
      else if(m.type==='audio'){const a=el('audio');a.src=src;a.controls=true;d.append(a)}
      else{const a=el('a','',m.file||'Open document');a.href=src;a.target='_blank';a.rel='noopener';d.append(a,document.createElement('br'))}
    }
    if(m.geo){const a=el('a','','📍 Open in Maps');a.href='https://maps.google.com/?q='+m.geo;a.target='_blank';a.rel='noopener';d.append(a,document.createElement('br'))}
    if(m.body)d.append(document.createTextNode(m.body));
    d.append(el('time','',fmtT(m.ts)));box.append(d);
  });
  if(stick)box.scrollTop=box.scrollHeight;
}
$('q').oninput=render;
$('back').onclick=()=>{S.cur=null;document.body.classList.remove('open');$('tt').textContent='Select a chat';render()};
$('set').onclick=()=>{$('u').value=S.url;$('t').value=S.tok;$('cfg').classList.add('open')};
$('f').onsubmit=e=>{e.preventDefault();S.url=localStorage.waUrl=$('u').value.trim();S.tok=localStorage.waTok=$('t').value;S.map.clear();$('cfg').classList.remove('open');load(true)};
document.onvisibilitychange=()=>{if(!document.hidden){S.unread=0;document.title='WhatsApp Inbox'}};
load(true);setInterval(()=>{if(!document.hidden)load(false)},10000);
</script>
</body>
</html>
